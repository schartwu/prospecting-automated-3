<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>KG Lead</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap">
<!-- config.js is written at deploy time (.github/workflows/pages.yml): window.EGP_API = "<function url>" -->
<script src="config.js"></script>
<!-- SheetJS, only for the "ดาวน์โหลด Excel" buttons -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
/* KG Lead: the morning email's lists by day (results, Sales' provinces, other provinces, legend) and one
   lead's page (status + history). Opened from personal links: #t=<token>[&lead=<key>]. */
:root {
  --bg: #f3f5f6; --surface: #ffffff; --ink: #17232b; --muted: #5b6b74; --line: #d6dde1;
  --accent: #0b6e69; --accent-soft: #dcefed; --on-accent: #ffffff;
  --good: #1f7a3a; --good-soft: #def2e3; --warn: #9a6400; --warn-soft: #fbf0d4; --bad: #b3261e; --bad-soft: #fbe1df;
  --font: "Kanit", Tahoma, "Leelawadee UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0f171c; --surface: #17222a; --ink: #e6edf0; --muted: #9aabb4; --line: #2b3a43;
  --accent: #4cc2b9; --accent-soft: #163a39; --on-accent: #0f171c;
  --good: #6fd08a; --good-soft: #17331f; --warn: #e6b65a; --warn-soft: #362a12; --bad: #f08a83; --bad-soft: #3a1b19;
  color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-weight: 300; font-size: 15px; line-height: 1.6; }
b, strong { font-weight: 500; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 18px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
h1 { font-size: 26px; font-weight: 600; margin: 0; letter-spacing: .01em; }
h2 { font-size: 19px; font-weight: 500; margin: 0; line-height: 1.35; text-wrap: balance; }
h3 { font-size: 16px; font-weight: 500; margin: 0; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.who { font-size: 13px; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
button, input, select, textarea { font-family: var(--font); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; font-weight: 400; padding: 3px 11px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 500; }
.chip.reason[aria-pressed="true"] { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
input.txt, textarea, select, input[type="date"] { font-size: 14px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
input.txt { min-width: 0; flex: 1 1 220px; }
textarea { width: 100%; resize: vertical; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { font-size: 14px; font-weight: 400; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.btn:hover { border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 500; }
.btn.small { font-size: 13px; padding: 3px 10px; }
.btn:disabled { opacity: .55; cursor: default; }
.datebar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.datebar .sep { color: var(--muted); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { font-size: 15px; font-weight: 400; padding: 8px 14px; border: 0; border-bottom: 3px solid transparent;
  background: none; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
.list { display: grid; gap: 8px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; }
.row .t { font-weight: 400; }
.row .t a { color: var(--ink); text-decoration: none; }
.row .t a:hover { color: var(--accent); text-decoration: underline; }
.row .side { display: grid; gap: 4px; justify-items: end; align-content: start; }
.meta { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 400; padding: 1px 9px;
  border-radius: 999px; white-space: nowrap; background: var(--bg); color: var(--muted); }
.pill.type { background: var(--accent-soft); color: var(--accent); }
.pill.st { background: var(--warn-soft); color: var(--warn); }
.pill.done { background: var(--accent-soft); color: var(--accent); }
.pill.win { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.urgent { color: var(--bad); font-weight: 500; }
.summary { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; font-size: 15px; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 13px; font-weight: 500; color: var(--muted); background: var(--bg); }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.group { display: grid; gap: 6px; }
.group > span { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
label.fld { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.msg { font-size: 14px; min-height: 1.4em; }
.msg.ok { color: var(--good); } .msg.err { color: var(--bad); }
.timeline { display: grid; gap: 8px; border-left: 2px solid var(--line); padding-left: 12px; }
.timeline .when { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.anns { display: grid; gap: 10px; }
.ann { display: grid; gap: 2px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.ann:last-child { border-bottom: 0; padding-bottom: 0; }
pre.mer { margin: 0; white-space: pre-wrap; font-family: var(--font); font-size: 14px; background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.two { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.legend dt { font-weight: 500; }
.legend dd { margin: 0 0 8px; color: var(--muted); }
@media (max-width: 760px) { .two { grid-template-columns: 1fr; } .row { grid-template-columns: 1fr; } .row .side { justify-items: start; } }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>KG Lead</h1>
    <span class="who" id="who"></span>
  </header>
  <main id="app"><div class="card empty">กำลังโหลด…</div></main>
</div>

<script>
(() => {
  const STATUS = {
    received: "👀 รับเรื่อง", contacted: "🤝 ติดต่อ/เข้าพบหน่วยงาน", sent_to_mer: "📦 ส่งให้ Mer",
    mer_replied: "💬 Mer ตอบแล้ว", bid: "✅ ยื่นราคาแล้ว", no_bid: "❌ ไม่ยื่น", other: "📝 อื่น ๆ",
  };
  const GROUPS = [["กำลังทำ", ["received", "contacted", "sent_to_mer", "mer_replied"]],
                  ["ตัดสินใจ", ["bid", "no_bid"]], ["อื่น ๆ", ["other"]]];
  const REASONS = ["ไม่ใช่สินค้าเรา", "Spec ล็อกยี่ห้อ", "ราคาสู้ไม่ได้", "อื่น ๆ"];
  const TYPE = { D0: "ประกาศเชิญชวน", B0: "ร่าง TOR", "15": "ราคากลาง", P0: "แผนจัดซื้อ", W0: "ประกาศผู้ชนะ",
                 D1: "ยกเลิกประกาศ", D2: "แก้ไขประกาศ", W1: "ยกเลิกผู้ชนะ", W2: "แก้ไขผู้ชนะ" };
  const TYPE_MEANING = {
    P0: "แผนจัดซื้อจัดจ้างประจำปี รู้ล่วงหน้าหลายเดือน ใช้วางแผนเข้าพบหน่วยงาน",
    B0: "ร่าง TOR / ร่างเอกสารประกวดราคา ประกาศเชิญชวนจริงตามมาราว 5 วัน ให้เตรียมสินค้า",
    "15": "ประกาศราคากลาง บอกงบประมาณ ส่วนใหญ่ออกวันเดียวกับประกาศเชิญชวน",
    D0: "ประกาศเชิญชวน เปิดให้ยื่นราคาแล้ว ดูวันยื่นซอง",
    W0: "ประกาศผู้ชนะ ใครชนะและราคาเท่าไร ใช้ดูคู่แข่ง",
  };
  const SCORE_BANDS = [["90–100", "สินค้าหลัก: วัสดุสำนักงาน กระดาษ หมึกพิมพ์ เครื่องเขียน"],
    ["75–89", "ซื้อ/เช่า คอมพิวเตอร์และไอที เฟอร์นิเจอร์ เครื่องใช้สำนักงาน"],
    ["60–74", "โครงการผสม มีสินค้าของเราเป็นส่วนสำคัญ"], ["50–59", "ก้ำกึ่ง: เครื่องใช้ไฟฟ้า เครื่องมือช่าง อุปกรณ์ความปลอดภัย"]];
  const RESULT = { win: ["🏆 OfficeMate ชนะ", "win"], lost: ["แพ้", "bad"], other_won: ["บริษัทอื่นชนะ", "bad"] };
  const TABS = [["results", "ผลลัพธ์"], ["target", "รายการ (กทม. และปริมณฑล)"], ["others", "รายการ (จังหวัดอื่น)"], ["legend", "คำอธิบาย"]];
  const SHOW = 200;

  const app = document.getElementById("app");
  const who = document.getElementById("who");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = v => v === null || v === undefined || v === "" ? "–" : Number(v).toLocaleString("th-TH", { maximumFractionDigits: 0 });
  const thDate = d => d ? new Date(d.length === 10 ? d + "T00:00:00" : d).toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "2-digit" }) : "–";
  const thTime = d => new Date(d).toLocaleString("th-TH", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  const todayISO = () => new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10);   // Bangkok date
  const addDays = (iso, n) => { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const daysTo = d => d ? Math.round((new Date(d + "T00:00:00Z") - new Date(todayISO() + "T00:00:00Z")) / 864e5) : null;
  const monthLabel = m => { if (!m) return ""; const [y, mo] = m.split("-").map(Number); return new Date(y, mo - 1, 1).toLocaleDateString("th-TH", { month: "short", year: "numeric" }); };
  const isOurs = w => !!w && /ออฟฟิศ\s*เมท/.test(w.replace(/ํา/g, "ำ"));

  function params() {
    const p = new URLSearchParams(location.hash.slice(1));
    return { t: p.get("t") || "", lead: p.get("lead") || "" };
  }
  const homeHref = () => "#" + new URLSearchParams({ t: params().t });
  const leadHref = key => "#" + new URLSearchParams({ t: params().t, lead: key });

  async function api(action, extra = {}) {
    if (!window.EGP_API) throw new Error("ยังไม่ได้ตั้งค่าที่อยู่ของระบบ ติดต่อผู้ดูแลระบบ");
    const res = await fetch(window.EGP_API, { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ token: params().t, action, ...extra }) });
    let data = {};
    try { data = await res.json(); } catch (e) { /* handled below */ }
    if (!res.ok) throw new Error(data.error || "เชื่อมต่อระบบไม่สำเร็จ ลองใหม่อีกครั้ง");
    if (data.user) who.textContent = `${data.user.name} · ${data.user.role === "dv" ? "อัปเดตสถานะได้" : "ดูอย่างเดียว"}`;
    return data;
  }
  const fail = e => { app.innerHTML = `<div class="card empty">${esc(e.message)}</div>`; };

  function statusPill(s, by, at) {
    if (!s) return '<span class="pill">ยังไม่มีสถานะ</span>';
    const cls = s === "bid" ? "done" : s === "no_bid" ? "bad" : "st";
    return `<span class="pill ${cls}">${esc(STATUS[s] || s)}</span>` +
      (at ? `<span class="small muted">${esc(by || "")} · ${esc(thTime(at))}</span>` : "");
  }

  function download(name, rows) {
    if (!window.XLSX) { alert("กำลังโหลดตัวสร้างไฟล์ ลองกดอีกครั้ง"); return; }
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
    XLSX.writeFile(wb, `KG_Lead_${name}_${state.from}${state.to !== state.from ? "_" + state.to : ""}.xlsx`);
  }

  // ---------------- home: calendar + tabs ----------------
  const state = { days: [], from: null, to: null, tab: "target", items: null, outcomes: null, provinces: [],
                  type: "all", status: "all", q: "", shown: SHOW, rFilter: "all" };

  async function showHome() {
    app.innerHTML = '<div class="card empty">กำลังโหลด…</div>';
    try {
      if (!state.days.length) {
        state.days = (await api("days")).days || [];
        const last = state.days[state.days.length - 1] || todayISO();
        state.from = state.from || last; state.to = state.to || last;
      }
      await loadRange();
    } catch (e) { fail(e); }
  }

  async function loadRange() {
    app.innerHTML = '<div class="card empty">กำลังโหลดรายการ…</div>';
    try {
      const [items, outcomes] = await Promise.all([
        api("items", { from: state.from, to: state.to }), api("outcomes", { from: state.from, to: state.to })]);
      state.items = items.rows || []; state.outcomes = outcomes.rows || []; state.provinces = items.provinces || [];
      state.shown = SHOW;
      renderHome();
    } catch (e) { fail(e); }
  }

  function inTarget(r) { return !r.province || state.provinces.includes(r.province); }

  function step(dir) {
    // previous / next morning-email day, single-day view
    const d = state.days;
    let i = dir < 0 ? [...d].reverse().find(x => x < state.from) : d.find(x => x > state.to);
    if (!i) i = addDays(dir < 0 ? state.from : state.to, dir);
    state.from = state.to = i; loadRange();
  }

  function renderHome() {
    const target = state.items.filter(inTarget), others = state.items.filter(r => !inTarget(r));
    const counts = { results: state.outcomes.filter(o => o.kind === "result" && o.ours).length, target: target.length, others: others.length };
    const single = state.from === state.to;
    const last = state.days[state.days.length - 1];
    app.innerHTML = `
      <div class="card">
        <div class="datebar">
          <button class="btn" type="button" id="prev" aria-label="ฉบับก่อนหน้า">◀</button>
          <input type="date" id="from" value="${state.from}" aria-label="ตั้งแต่วันที่">
          <span class="sep">ถึง</span>
          <input type="date" id="to" value="${state.to}" aria-label="ถึงวันที่">
          <button class="btn" type="button" id="next" aria-label="ฉบับถัดไป">▶</button>
          <button class="btn small" type="button" data-q="last">ฉบับล่าสุด</button>
          <button class="btn small" type="button" data-q="7">7 วัน</button>
          <button class="btn small" type="button" data-q="30">30 วัน</button>
        </div>
        <div class="small muted">${single ? `อีเมลเช้าวันที่ ${esc(thDate(state.from))}` : `อีเมลเช้าตั้งแต่ ${esc(thDate(state.from))} ถึง ${esc(thDate(state.to))}`}
          · วันที่ = วันที่รายการอยู่ในอีเมลเช้า (ข้อมูลของวันทำการก่อนหน้า)${last ? ` · ฉบับล่าสุด ${esc(thDate(last))}` : ""}</div>
      </div>
      <div class="tabs" role="tablist">${TABS.map(([k, label]) => `<button class="tab" role="tab" type="button" data-tab="${k}"
        aria-selected="${state.tab === k}">${label}${counts[k] !== undefined ? ` (${counts[k]})` : ""}</button>`).join("")}</div>
      <div id="tabbody"></div>`;
    document.getElementById("prev").onclick = () => step(-1);
    document.getElementById("next").onclick = () => step(1);
    const fromEl = document.getElementById("from"), toEl = document.getElementById("to");
    fromEl.onchange = () => { if (!fromEl.value) return; state.from = fromEl.value; if (state.to < state.from) state.to = state.from; loadRange(); };
    toEl.onchange = () => { if (!toEl.value) return; state.to = toEl.value; if (state.from > state.to) state.from = state.to; loadRange(); };
    app.querySelectorAll("[data-q]").forEach(b => b.onclick = () => {
      const end = last || todayISO();
      if (b.dataset.q === "last") { state.from = state.to = end; }
      else { state.to = end; state.from = addDays(end, -(Number(b.dataset.q) - 1)); }
      loadRange();
    });
    app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { state.tab = b.dataset.tab; state.shown = SHOW; renderHome(); });
    const body = document.getElementById("tabbody");
    if (state.tab === "results") renderResults(body);
    else if (state.tab === "legend") renderLegend(body);
    else renderItems(body, state.tab === "target" ? target : others, state.tab === "target");
  }

  // ---- รายการ tabs ----
  const TYPE_FILTERS = [["all", "ทั้งหมด"], ["D0", "ประกาศเชิญชวน"], ["B0", "ร่าง TOR"], ["15", "ราคากลาง"], ["P0", "แผนจัดซื้อ"], ["W0", "ผลผู้ชนะ"]];
  const STATUS_FILTERS = [["all", "ทุกสถานะ", () => true], ["none", "ยังไม่มีสถานะ", r => !r.status],
    ["doing", "กำลังทำ", r => ["received", "contacted", "sent_to_mer", "mer_replied", "other"].includes(r.status)],
    ["bid", "ยื่นแล้ว", r => r.status === "bid"], ["no_bid", "ไม่ยื่น", r => r.status === "no_bid"]];

  function renderItems(body, all, isTarget) {
    const q = state.q.trim().toLowerCase();
    const sf = STATUS_FILTERS.find(f => f[0] === state.status)[2];
    let rows = all.filter(r => state.type === "all" || r.type === state.type)
      .filter(r => r.type === "W0" || sf(r))
      .filter(r => !q || `${r.title} ${r.dept_name} ${r.province || ""} ${r.project_no || ""} ${r.winners || ""}`.toLowerCase().includes(q));
    if (state.status !== "all") rows = rows.filter(r => r.type !== "W0");
    rows.sort((a, b) => {   // invitations closing soon first, then by score
      const da = a.type === "D0" ? daysTo(a.bid_date) : null, db = b.type === "D0" ? daysTo(b.bid_date) : null;
      const ua = da !== null && da >= 0 ? da : 999, ub = db !== null && db >= 0 ? db : 999;
      return ua - ub || b.score - a.score;
    });
    const typeCount = k => all.filter(r => k === "all" || r.type === k).length;
    const list = rows.slice(0, state.shown).map(r => {
      const left = r.type === "D0" ? daysTo(r.bid_date) : null;

  async function showLead(key) {

  function leadSummary(anns) {
    const order = ["D0", "B0", "15", "P0"];
    const main = [...anns].sort((a, b) => order.indexOf(a.type) - order.indexOf(b.type)).find(a => order.includes(a.type)) || anns[0];
    const pick = k => anns.map(a => a[k]).filter(v => v !== null && v !== undefined && v !== "");
    const budget = Math.max(...pick("budget_thb").map(Number), -1);
    const d0 = anns.find(a => a.type === "D0" && a.bid_date);
    const w0 = [...anns].reverse().find(a => a.type === "W0" && Array.isArray(a.winners) && a.winners.length);
    const tor = anns.find(a => a.type === "B0") || anns.find(a => a.type === "D0") || main;
    return { main, budget: budget >= 0 ? budget : null, d0, w0, tor, province: pick("province")[0] || "" };
  }

  function merText(s) {
    const m = s.main;
    const lines = [`[ขอเช็คสินค้า] ${m.project_no ? `e-GP ${m.project_no}` : `แผน ${m.plan_no}`}`, m.title,
      `หน่วยงาน: ${m.dept_name}${s.province ? ` (${s.province})` : ""}`];
    const parts = [s.budget !== null ? `งบประมาณ: ${money(s.budget)} บาท` : "",
      s.d0 ? `ยื่นซอง ${thDate(s.d0.bid_date)}${s.d0.bid_time ? " " + s.d0.bid_time : ""}` : ""].filter(Boolean);
    if (parts.length) lines.push(parts.join(" · "));
    lines.push("ขอ: ราคาทุน + สต็อก ภายใน ____", `เอกสาร/TOR: ${s.tor.link}`);
    return lines.join("\n");
  }

            ${e.note ? `<div class="small muted">${esc(e.note)}</div>` : ""}</div>`).join("") : '<div class="small muted">ยังไม่มีการอัปเดตสถานะ</div>'}</div></div>
        </div>
        <div style="display:grid;gap:12px">
          <div class="card"><h3>ข้อความส่งให้ Mer</h3>
            <div class="small muted">คัดลอกไปวางใน LINE / Teams / Email แล้วกดสถานะ “ส่งให้ Mer”</div>
            <pre class="mer" id="mertext">${esc(merText(s))}</pre>
            <div><button class="btn" type="button" id="copy">คัดลอกข้อความ</button></div>
            <div class="msg" id="copymsg" aria-live="polite"></div></div>
          <div class="card"><h3>ประกาศของโครงการนี้</h3><div class="anns">${annList}</div></div>
        </div>
      </div>`;
    document.getElementById("copy").onclick = () => {
      const el = document.getElementById("mertext"), cm = document.getElementById("copymsg");
      const fallback = () => { const r = document.createRange(); r.selectNodeContents(el);
        const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); cm.textContent = "เลือกข้อความให้แล้ว กด Ctrl+C เพื่อคัดลอก"; };
      try { navigator.clipboard.writeText(el.textContent).then(() => { cm.className = "msg ok"; cm.textContent = "คัดลอกแล้ว"; }, fallback); }
      catch (e) { fallback(); }
    };
    if (!isDV) return;
    const f = document.getElementById("form");
    f.querySelectorAll("[data-s]").forEach(b => b.onclick = () => {
      current.status = b.dataset.s;
      f.querySelectorAll("[data-s]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      document.getElementById("reasons").hidden = current.status !== "no_bid";
      document.getElementById("pricebox").hidden = current.status !== "bid";
      document.getElementById("notehint").textContent = current.status === "other" ? "(ต้องใส่สำหรับ “อื่น ๆ”)" : "(ไม่บังคับ)";
      document.getElementById("msg").textContent = "";
    });
    f.querySelectorAll(".reason").forEach(c => c.onclick = () => {
      const r = c.textContent;
      if (current.reasons.has(r)) current.reasons.delete(r); else current.reasons.add(r);
      c.setAttribute("aria-pressed", String(current.reasons.has(r)));
    });
    document.getElementById("save").onclick = async () => {
      const msg = document.getElementById("msg"), btn = document.getElementById("save");
      const note = document.getElementById("note").value.trim();
      const err = t => { msg.className = "msg err"; msg.textContent = t; };
      if (!current.status) return err("เลือกสถานะก่อน แล้วกดบันทึก");
      if (current.status === "no_bid" && !current.reasons.size) return err("เลือกเหตุผลที่ไม่ยื่นอย่างน้อย 1 ข้อ");
      if (current.status === "other" && !note) return err("สถานะ “อื่น ๆ” ต้องใส่หมายเหตุ");
      btn.disabled = true; msg.className = "msg"; msg.textContent = "กำลังบันทึก…";
      try {
        const res = await api("save", { key: current.key, status: current.status, reasons: [...current.reasons],
          bid_price: current.status === "bid" ? document.getElementById("price").value.trim() : null, note });
        current.data.events = res.events; current.status = null; current.reasons = new Set();
        state.items = null;   // the lists show the new status next time
        renderLead();
        const m = document.getElementById("msg"); m.className = "msg ok"; m.textContent = "บันทึกแล้ว";
      } catch (e) { btn.disabled = false; err(e.message); }
    };
  }

  function route() {
    const { t, lead } = params();
    if (!/^[0-9a-f]{64}$/.test(t)) {
      app.innerHTML = '<div class="card empty">เปิดหน้านี้จากปุ่ม “อัปเดตสถานะ” หรือลิงก์ KG Lead ในอีเมล e-GP Alert</div>';
      return;
    }
    window.scrollTo(0, 0);
    if (lead) showLead(lead);
    else if (state.items && state.days.length) renderHome();
    else if (state.days.length) loadRange();
    else showHome();
  }
  addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
