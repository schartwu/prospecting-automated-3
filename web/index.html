<style>
/* KG Lead. Pages: ภาพรวม (what needs attention, how we are doing), Lead (opportunities: plans, draft TORs,
   reference prices, invitations), ติดตามสถานะ (leads someone has acted on, by stage), ผลลัพธ์ (who won),
   คู่มือ. A lead opens its own page (status + history). Personal links: #t=<token>[&v=<page>][&lead=<key>]. */
:root {
  --bg: #f2f4f5; --surface: #ffffff; --ink: #15212a; --muted: #5d6c75; --line: #d9dfe3; --soft: #eef1f3;
  --accent: #0b6e69; --accent-soft: #dcefed; --on-accent: #ffffff;
  --money: #0b4f4b;
  --good: #1f7a3a; --good-soft: #def2e3; --warn: #93600a; --warn-soft: #fbefd2; --bad: #b3261e; --bad-soft: #fbe1df;
  --font: "Kanit", Tahoma, "Leelawadee UI", sans-serif;
  --nav-h: 0px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0e161b; --surface: #16212a; --ink: #e6edf0; --muted: #98a9b2; --line: #2a3943; --soft: #1c2a33;
  --accent: #4cc2b9; --accent-soft: #143836; --on-accent: #0e161b;
  --money: #7fdad2;
  --good: #6fd08a; --good-soft: #16321e; --warn: #e6b65a; --warn-soft: #352910; --bad: #f08a83; --bad-soft: #3a1b19;
  color-scheme: dark; } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-weight: 300; font-size: 15px; line-height: 1.55;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); }
b, strong { font-weight: 500; }
a { color: var(--accent); }
button, input, select, textarea { font-family: var(--font); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* app bar + navigation */
.appbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.appbar .in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 18px; min-height: 56px; }
.brand { font-size: 22px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
.brand span { color: var(--accent); }
.nav { display: flex; gap: 2px; flex: 1; }
.nav a { display: inline-flex; align-items: center; gap: 6px; padding: 16px 12px 13px; color: var(--muted); text-decoration: none;
  font-weight: 400; border-bottom: 3px solid transparent; white-space: nowrap; }
.nav a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
.nav svg { width: 18px; height: 18px; }
.who { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
@media (max-width: 820px) {
  :root { --nav-h: 62px; }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px); justify-content: space-around; }
  .nav a { flex-direction: column; gap: 0; padding: 8px 2px 6px; font-size: 11.5px; border-bottom: 0; border-top: 3px solid transparent; flex: 1; justify-content: center; }
  .nav a[aria-current="page"] { border-top-color: var(--accent); }
  .nav svg { width: 22px; height: 22px; }
  .appbar .in { justify-content: space-between; }
}

/* One spacing rhythm: 16px between page sections, 10px inside them. minmax(0, 1fr) keeps wide content
   (tables, the status board) from stretching the page past the screen; it scrolls inside its own box. */
main { max-width: 1180px; margin: 0 auto; padding-block: 16px 40px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
#body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }
h1 { font-size: 22px; font-weight: 500; margin: 0; line-height: 1.3; text-wrap: balance; }
h2 { font-size: 18px; font-weight: 500; margin: 0; }
h3 { font-size: 15px; font-weight: 500; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* toolbar: period + area */
.toolbar { display: grid; gap: 10px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; background: var(--soft); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--ink); font-size: 13.5px; font-weight: 400; padding: 5px 11px; border-radius: 8px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.toolrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.daterow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
input[type="date"], input.txt, select, textarea { font-size: 14px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
input.txt { min-width: 0; flex: 1 1 240px; }
textarea { width: 100%; resize: vertical; }
.period-label { font-size: 13px; color: var(--muted); }

.btn { font-size: 14px; font-weight: 400; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 500; }
.btn.sm { font-size: 13px; padding: 3px 10px; }
.btn:disabled { opacity: .55; cursor: default; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.frow { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; align-items: start; }
.frow > .flabel { font-size: 13px; color: var(--muted); padding-top: 6px; }
.filters, .frows { display: grid; gap: 10px; }
.gcol { display: grid; gap: 16px; align-content: start; min-width: 0; }
.ftoggle { display: none; }
@media (max-width: 640px) {
  .frow { grid-template-columns: 1fr; gap: 4px; } .frow > .flabel { padding-top: 0; }
  .ftoggle { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; }
  .filters:not(.open) { display: none; }
}
.chip { font-size: 13px; font-weight: 400; padding: 3px 11px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 500; }
.chip.reason[aria-pressed="true"] { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.chip .n { color: var(--muted); margin-left: 2px; }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
@media (max-width: 640px) { .kpis { grid-template-columns: 1fr 1fr; } .kpi .value { font-size: 24px; } .kpi { padding: 10px 12px; } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; text-decoration: none; color: inherit; }
a.kpi:hover { border-color: var(--accent); }
.kpi .label { font-size: 13px; color: var(--muted); }
.kpi .value { font-size: 28px; font-weight: 500; line-height: 1.2; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.kpi.win { border-color: var(--good); }
tr.warn td { background: var(--bad-soft); }
tr.total td { font-weight: 500; border-top: 2px solid var(--line); }
.tbl.split table { table-layout: fixed; width: 100%; }
.tbl.plans { margin-top: 10px; }
.who-by { font-weight: 500; color: var(--ink); }
button.kpi { font: inherit; text-align: left; cursor: pointer; }
button.kpi:hover { border-color: var(--accent); }
button.kpi[aria-expanded="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.kpi .hint { font-size: 12px; color: var(--accent); margin-top: 2px; }
.card.detail { border-color: var(--accent); }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--soft); }
tr.clickable[aria-expanded="true"] td { background: var(--accent-soft); }
tr.sub td { background: var(--soft); }
.kpi.win .value { color: var(--good); }
.kpi.alert .value { color: var(--warn); }

/* lead cards */
.list { display: grid; gap: 8px; }
.lead { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 8px 16px; color: inherit; text-decoration: none; }
.lead:hover { border-color: var(--accent); }
.lead .badges { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.lead .title { font-size: 15.5px; font-weight: 400; line-height: 1.45; }
.lead .money { text-align: right; display: grid; align-content: start; gap: 2px; }
.lead .money .label { font-size: 12px; color: var(--muted); }
.lead .money .amt { font-size: 22px; font-weight: 500; color: var(--money); font-variant-numeric: tabular-nums; line-height: 1.2; }
.lead .money .amt.none { font-size: 14px; font-weight: 300; color: var(--muted); }
.lead .money .act { margin-top: 6px; justify-self: end; }
.meta { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 400; padding: 1px 9px;
  border-radius: 999px; white-space: nowrap; background: var(--soft); color: var(--muted); }
.pill.type { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.pill.st { background: var(--warn-soft); color: var(--warn); }
.pill.done { background: var(--accent-soft); color: var(--accent); }
.pill.win { background: var(--good-soft); color: var(--good); font-weight: 500; }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.score { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 22px; padding: 0 6px;
  border-radius: 6px; font-size: 12.5px; font-weight: 500; font-variant-numeric: tabular-nums; }
.score.s90 { background: var(--good-soft); color: var(--good); }
.score.s75 { background: var(--accent-soft); color: var(--accent); }
.score.s60 { background: var(--warn-soft); color: var(--warn); }
.score.s50 { background: var(--soft); color: var(--muted); }
.urgent { color: var(--bad); font-weight: 500; }
@media (max-width: 640px) {
  .lead { grid-template-columns: 1fr; }
  .lead .money { text-align: left; grid-template-columns: auto 1fr auto; align-items: baseline; gap: 8px; }
  .lead .money .act { margin-top: 0; }
}

/* overview: two lists side by side, progress and types stacked in the third column */
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 16px; align-items: start; }
.grid2 > * { min-width: 0; }
.ov { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.ov .stack { display: grid; gap: 16px; min-width: 0; }
@media (max-width: 1080px) { .ov { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ov .stack { grid-column: 1 / -1; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; } }
@media (max-width: 700px) { .ov, .ov .stack { grid-template-columns: minmax(0, 1fr); } }
.mini { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 9px 0; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; }
.mini:last-child { border-bottom: 0; }
.mini:hover .t { color: var(--accent); }
.mini .t { font-size: 14.5px; }
.mini .amt { font-weight: 500; color: var(--money); font-variant-numeric: tabular-nums; text-align: right; }
.funnel { display: grid; gap: 7px; }
.fbar { display: grid; grid-template-columns: 120px 1fr 60px; gap: 10px; align-items: center; font-size: 14px; }
.fbar .track { background: var(--soft); border-radius: 5px; height: 16px; overflow: hidden; }
.fbar .fill { height: 100%; background: var(--accent); border-radius: 5px; min-width: 2px; }
.fbar .fill.win { background: var(--good); }
.fbar .n { text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }

/* tracking board */
.board { display: grid; grid-template-columns: repeat(6, minmax(170px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 6px; min-width: 0; }
.col { background: var(--soft); border-radius: 12px; padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 120px; }
.col h3 { display: flex; justify-content: space-between; font-size: 14px; }
.tcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; display: grid; gap: 4px;
  color: inherit; text-decoration: none; }
.tcard:hover { border-color: var(--accent); }
.tcard .t { font-size: 14px; line-height: 1.4; }
.tcard .amt { font-weight: 500; color: var(--money); font-variant-numeric: tabular-nums; }
.colpick { display: none; }
@media (max-width: 820px) {
  .board { grid-template-columns: minmax(0, 1fr); overflow: visible; }
  .colpick { display: flex; }
  .col:not(.on) { display: none; }
}

/* tables */
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 13px; font-weight: 500; color: var(--muted); background: var(--soft); white-space: nowrap; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.num.money { color: var(--money); font-weight: 500; }
tr:last-child td { border-bottom: 0; }

/* lead page */
.two { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 820px) { .two { grid-template-columns: 1fr; } .two .side { order: -1; } }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 20px; align-items: start; }
.hero .amt { font-size: 30px; font-weight: 500; color: var(--money); font-variant-numeric: tabular-nums; line-height: 1.15; text-align: right; }
.hero .amt-label { text-align: right; }
@media (max-width: 640px) { .hero { grid-template-columns: 1fr; } .hero .amt, .hero .amt-label { text-align: left; } }
.group { display: grid; gap: 6px; }
.group > span { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
label.fld { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.msg { font-size: 14px; min-height: 1.4em; }
.msg.ok { color: var(--good); } .msg.err { color: var(--bad); }
.timeline { display: grid; gap: 9px; border-left: 2px solid var(--line); padding-left: 12px; }
.timeline .when { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ann { display: grid; gap: 2px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.ann:last-child { border-bottom: 0; padding-bottom: 0; }
.legend dt { font-weight: 500; }
.legend dd { margin: 0 0 8px; color: var(--muted); }
.empty { padding: 26px 16px; text-align: center; color: var(--muted); }
.error { border-color: var(--bad); color: var(--bad); }
.skeleton { height: 64px; border-radius: 12px; background: linear-gradient(90deg, var(--soft), var(--surface), var(--soft)); background-size: 200% 100%; }
@media (prefers-reduced-motion: no-preference) { .skeleton { animation: sh 1.2s infinite linear; } @keyframes sh { to { background-position: -200% 0; } } }
</style>
</head>

  const VIEWS = [
    ["leads", "Lead", '<path d="M4 6h16M4 12h16M4 18h10"/>'],
    ["tracking", "ติดตามสถานะ", '<path d="M4 5h4v14H4zM10 5h4v9h-4zM16 5h4v6h-4z"/>'],
    ["results", "ผลลัพธ์", '<path d="M7 4h10v4a5 5 0 0 1-10 0zM12 13v4M8 20h8M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>'],
    ["overview", "ภาพรวม", '<path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 4v4h6V4z"/>'],
    ["guide", "คู่มือ", '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.5"/>'],
  ];

  // ---------------- helpers ----------------
  const main = document.getElementById("main");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = v => v === null || v === undefined || v === "" ? null : Number(v);
  const money = v => num(v) === null ? "–" : num(v).toLocaleString("th-TH", { maximumFractionDigits: 0 });
  const baht = v => num(v) === null ? "–" : "฿" + money(v);
  const short = v => { const n = num(v); if (n === null) return "–"; if (n >= 1e6) return "฿" + (n / 1e6).toLocaleString("th-TH", { maximumFractionDigits: 1 }) + " ล้าน"; return baht(n); };
  const thDate = d => d ? new Date(d.length === 10 ? d + "T00:00:00" : d).toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "2-digit" }) : "–";
  const thTime = d => new Date(d).toLocaleString("th-TH", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  const todayISO = () => new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10);
  const addDays = (iso, n) => { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const daysTo = d => d ? Math.round((new Date(d + "T00:00:00Z") - new Date(todayISO() + "T00:00:00Z")) / 864e5) : null;
  const monthLabel = m => { if (!m) return ""; const [y, mo] = m.split("-").map(Number); return new Date(y, mo - 1, 1).toLocaleDateString("th-TH", { month: "short", year: "numeric" }); };
  const isOurs = w => !!w && /ออฟฟิศ\s*เมท/.test(w.replace(/ํา/g, "ำ"));
  const scoreBadge = s => `<span class="score s${s >= 90 ? 90 : s >= 75 ? 75 : s >= 60 ? 60 : 50}" title="คะแนนความตรงกับสินค้า OfficeMate">${s}</span>`;
  // วิธีจัดหา: a short badge, and three groups for the filters (plans carry no method: อื่น ๆ)
  const methodShort = m => !m ? "" : /e-bidding/i.test(m) ? "e-bidding" : /e-market/i.test(m) ? "e-market"
    : /เฉพาะเจาะจง/.test(m) ? "เฉพาะเจาะจง" : /คัดเลือก/.test(m) ? "คัดเลือก" : /สอบราคา/.test(m) ? "สอบราคา" : m;
  const methodGroup = m => !m ? "other" : /e-bidding/i.test(m) ? "ebid" : /e-market/i.test(m) ? "emarket" : /เฉพาะเจาะจง/.test(m) ? "specific" : "other";
  const METHOD_FILTERS = [["all", "ทุกวิธี"], ["ebid", "e-bidding"], ["emarket", "e-market"], ["specific", "เฉพาะเจาะจง"], ["other", "อื่น ๆ"]];
  const inMethod = (k, r) => k === "all" || methodGroup(r.method) === k;
  const methodPill = m => m ? `<span class="pill" title="${esc(m)}">${esc(methodShort(m))}</span>` : "";
  // W2 changed the winner, W1 withdrew it (back to waiting for the result)
  const changePill = r => !r.award_changed && !r.changed ? ""
    : r.withdrawn || (r.award_changed && !r.awarded) ? '<span class="pill warn">🔄 ยกเลิกประกาศผู้ชนะ รอประกาศใหม่</span>'
    : `<span class="pill warn" title="${esc(r.prev_winners ? "เดิม: " + r.prev_winners : "")}">🔄 เปลี่ยนผู้ชนะ${r.prev_winners ? " · เดิม " + esc(r.prev_winners) : ""}</span>`;
  const dueText = d => { const n = daysTo(d); return n === 0 ? "วันนี้" : n === 1 ? "พรุ่งนี้" : `อีก ${n} วัน`; };
  const sum = (rows, k) => rows.reduce((a, r) => a + (num(r[k]) || 0), 0);

  function hashParams() { return new URLSearchParams(location.hash.slice(1)); }
  const token = () => hashParams().get("t") || "";
  const href = (o = {}) => "#" + new URLSearchParams({ t: token(), ...o });

  function statusPill(s, by, at) {
    if (!s) return '<span class="pill">ยังไม่มีสถานะ</span>';
    const cls = s === "bid" ? "done" : s === "no_bid" ? "bad" : "st";
    return `<span class="pill ${cls}" title="${esc(by ? `${by} · ${thTime(at)}` : "")}">${esc(STATUS[s] || s)}</span>`;
  }
  const resultPill = r => r && RESULT[r] ? `<span class="pill ${RESULT[r][1]}">${RESULT[r][0]}</span>` : "";

  async function api(action, extra = {}) {
    if (!window.EGP_API) throw new Error("ยังไม่ได้ตั้งค่าที่อยู่ของระบบ ติดต่อผู้ดูแลระบบ");
    const res = await fetch(window.EGP_API, { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ token: token(), action, ...extra }) });
    let data = {};
    try { data = await res.json(); } catch (e) { /* handled below */ }
    if (!res.ok) throw new Error(data.error || "เชื่อมต่อระบบไม่สำเร็จ ลองใหม่อีกครั้ง");
    if (data.user) {
      state.user = data.user;
      document.getElementById("who").textContent = `${data.user.name} · ${EDITORS.includes(data.user.role) ? "อัปเดตสถานะได้" : "ดูอย่างเดียว"}`;
    }
    if (data.provinces) state.provinces = data.provinces;
    return data;
  }

  function download(name, rows) {
    if (!window.XLSX) { setTimeout(() => download(name, rows), 400); return; }
    const wb = XLSX.utils.book_new(), p = per();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), name.slice(0, 31));
    XLSX.writeFile(wb, `KG_Lead_${name}_${p.from}${p.to !== p.from ? "_" + p.to : ""}.xlsx`);
  }

  // ---------------- state ----------------
  // Each tab keeps its own period. Lead, ผลลัพธ์ and ภาพรวม count by morning-email day; ติดตามสถานะ by the
  // day of the latest status update.
  const state = {
    user: null, provinces: [], days: [], area: "target",
    per: { leads: { preset: "last" }, tracking: { preset: "month" }, results: { preset: "month" }, overview: { preset: "month" } },
    cache: {}, leads: null, outcomes: null, tracking: null,
    l: { type: "D0", score: "all", method: "all", status: "none", q: "", sort: "score", shown: 60 },
    t: { col: "all", who: "all", sort: "latest", shown: 50 },
    r: { q: "", score: "all", method: "all", shown: 100 },
    o: { score: "all", method: "all" },
  };
  const per = () => state.per[currentView] || state.per.leads;
  const mayEdit = () => !!state.user && EDITORS.includes(state.user.role);
  // A D0 whose bid day has passed and nobody gave it a status: a lead we let go by.
  const closed = r => !!(r.awarded || r.result || r.cancelled);
  const missed = r => !r.status && r.type === "D0" && !r.cancelled && daysTo(r.bid_date) !== null && daysTo(r.bid_date) < 0;
  // One status per lead, first match wins: cancelled, then what someone pressed, then a bid day that passed
  // with nobody pressing anything, else no status yet. The Lead filters count each lead once.
  const leadState = r => r.cancelled ? "cancelled" : r.status === "bid" ? "bid" : r.status === "no_bid" ? "no_bid"
    : r.status ? "doing" : missed(r) ? "missed" : "none";
  const leadPill = r => { const st = leadState(r);
    return st === "cancelled" ? '<span class="pill bad">ยกเลิกแล้ว</span>'
      : st === "missed" ? '<span class="pill bad">⚠️ เลยวันยื่นซอง ไม่มีใครอัปเดต</span>' : statusPill(r.status, r.status_by, r.status_at); };
  const inTarget = r => !r.province || state.provinces.includes(r.province);
  const areaOk = r => state.area === "all" || (state.area === "target" ? inTarget(r) : !inTarget(r));
  const AREA = [["target", "กทม. และปริมณฑล"], ["others", "จังหวัดอื่น"], ["all", "ทุกจังหวัด"]];
  const PRESETS = [["last", "ฉบับล่าสุด"], ["7", "7 วัน"], ["30", "30 วัน"], ["month", "เดือนนี้"], ["90", "3 เดือน"], ["all", "12 เดือน"], ["custom", "กำหนดเอง"]];

  function applyPreset(p, target = per()) {
    target.preset = p;
    const end = todayISO(), last = state.days[state.days.length - 1] || end;
    if (p === "last") { target.from = target.to = last; }
    else if (p === "month") { target.from = end.slice(0, 8) + "01"; target.to = end; }
    // "12 เดือน": the longest preset. Each extra month adds about 2 MB to every load (results + leads).
    else if (p === "all") { target.to = end; const y = addDays(end, -364); target.from = y > FIRST_DAY ? y : FIRST_DAY; }
    else if (p !== "custom") { target.to = end; target.from = addDays(end, -(Number(p) - 1)); }
  }

  async function ensureRange() {
    const { from, to } = per(), key = `${from}|${to}`;
    if (!state.cache[key]) {
      const [l, o] = await Promise.all([api("leads", { from, to }), api("outcomes", { from, to })]);
      state.cache[key] = { leads: groupLeads(l.rows || []), outcomes: o.rows || [] };
    }
    ({ leads: state.leads, outcomes: state.outcomes } = state.cache[key]);
  }

  // One row per project. Its announcements (ร่าง TOR → ราคากลาง → ประกาศเชิญชวน) fold into the latest one,
  // so a project is counted once and its budget once. A plan (P0) joins its project when the database matched
  // them (plan_links: same agency, same budget to the baht, one-to-one); otherwise it stays apart.
  const STAGE = { P0: 0, B0: 1, "15": 2, D0: 3 };
  function groupLeads(rows) {
    const by = new Map();
    rows.forEach(r => { const g = by.get(r.lead_key); if (g) g.push(r); else by.set(r.lead_key, [r]); });
    return [...by.values()].map(rs => {
      rs.sort((a, b) => STAGE[a.type] - STAGE[b.type] || String(a.pub_date).localeCompare(String(b.pub_date)));
      const top = rs[rs.length - 1], seen = new Set();
      return { ...top, score: Math.max(...rs.map(r => r.score)), linked_plan: rs.map(r => r.linked_plan).find(Boolean) || null,
        budget_thb: num(top.budget_thb) !== null ? top.budget_thb : (rs.find(r => num(r.budget_thb) !== null) || {}).budget_thb ?? null,
        stages: [...rs].reverse().filter(r => !seen.has(r.type) && seen.add(r.type)).reverse().map(r => ({ type: r.type, pub_date: r.pub_date })) };
    });
  }

  // ---------------- layout pieces ----------------
  function renderNav(view) {
    document.getElementById("nav").innerHTML = VIEWS.map(([k, label, icon]) =>
      `<a href="${href({ v: k })}" ${view === k ? 'aria-current="page"' : ""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icon}</svg>${label}</a>`).join("");
  }

  function toolbar({ period = true, area = true } = {}) {
    const p = per(), single = p.from === p.to;
    const what = currentView === "tracking" ? "อัปเดตสถานะล่าสุด" : "อีเมลเช้า";
    const periodText = (single ? `${what}วันที่ ${thDate(p.from)}` : `${what} ${thDate(p.from)} – ${thDate(p.to)}`)
      + (p.from < FIRST_DAY ? " · ข้อมูลเริ่ม 9 ต.ค. 2569" : "");
    // No min on the date inputs: any month can be picked; days before the first data show an empty list.
    return `<div class="card toolbar">
      ${period ? `<div class="toolrow">
        <div class="seg" role="group" aria-label="ช่วงเวลา">${PRESETS.map(([k, l]) => `<button type="button" data-preset="${k}" aria-pressed="${p.preset === k}">${l}</button>`).join("")}</div>
        <div class="daterow">
          ${single ? `<button class="btn sm" type="button" data-step="-1" aria-label="วันก่อนหน้า">◀</button>` : ""}
          <input type="date" id="from" value="${p.from}" max="${todayISO()}" aria-label="ตั้งแต่วันที่">
          <span class="muted">ถึง</span>
          <input type="date" id="to" value="${p.to}" max="${todayISO()}" aria-label="ถึงวันที่">
          ${single ? `<button class="btn sm" type="button" data-step="1" aria-label="วันถัดไป">▶</button>` : ""}
        </div></div>` : ""}
      <div class="toolrow">
        ${area ? `<div class="seg" role="group" aria-label="พื้นที่">${AREA.map(([k, l]) => `<button type="button" data-area="${k}" aria-pressed="${state.area === k}">${l}</button>`).join("")}</div>` : "<span></span>"}
        <span class="period-label">${period ? esc(periodText) : ""}</span>
      </div></div>`;
  }

  function bindToolbar(rerender) {
    const p = per();
    main.querySelectorAll("[data-preset]").forEach(b => b.onclick = () => {
      if (b.dataset.preset === "custom") { p.preset = "custom"; rerender(false); main.querySelector("#from")?.focus(); return; }
      applyPreset(b.dataset.preset, p); rerender(true);
    });
    main.querySelectorAll("[data-area]").forEach(b => b.onclick = () => { state.area = b.dataset.area; rerender(false); });
    const f = main.querySelector("#from"), t = main.querySelector("#to");
    if (f) f.onchange = () => { if (!f.value) return; p.preset = "custom"; p.from = f.value; if (p.to < p.from) p.to = p.from; rerender(true); };
    if (t) t.onchange = () => { if (!t.value) return; p.preset = "custom"; p.to = t.value; if (p.from > p.to) p.from = p.to; rerender(true); };
    main.querySelectorAll("[data-step]").forEach(b => b.onclick = () => {
      const dir = Number(b.dataset.step), d = state.days;
      // the lists step between morning-email days; the status board steps one calendar day
      const next = currentView === "tracking" ? null : dir < 0 ? [...d].reverse().find(x => x < p.from) : d.find(x => x > p.to);
      p.from = p.to = next || addDays(p.from, dir); p.preset = "custom"; rerender(true);
    });
  }

  // Render a page: toolbar stays put; data loading / errors show below it.
  async function page(view, build, opts = {}) {
    const draw = async (reload) => {
      main.innerHTML = toolbar(opts) + `<div id="body">${reload ? '<div class="list"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>' : ""}</div>`;
      bindToolbar(draw);
      const body = document.getElementById("body");
      try {
        if (opts.load) await opts.load();
        body.innerHTML = "";
        build(body, draw);
      } catch (e) { body.innerHTML = `<div class="card empty error">${esc(e.message)}</div>`; }
    };
    await draw(true);
  }

  // ---------------- lead card ----------------
  function leadCard(r) {
    const left = r.type === "D0" ? daysTo(r.bid_date) : null;
    const when = r.type === "P0" ? (r.expected_month ? `<span>คาดว่าจะประกาศ ${esc(monthLabel(r.expected_month))}</span>` : "")
      : r.bid_date ? `<span class="${left !== null && left >= 0 && left <= 3 ? "urgent" : ""}">ยื่นซอง ${esc(thDate(r.bid_date))}${r.bid_time ? " " + esc(r.bid_time) : ""}${left !== null && left >= 0 ? ` · ${dueText(r.bid_date)}` : left !== null && left < 0 ? " · ปิดแล้ว" : ""}</span>` : "";
    const canEdit = mayEdit() && !closed(r);
    const trail = r.stages && r.stages.length > 1
      ? `<span>${r.stages.map(x => `${esc(TYPE[x.type] || x.type)} ${esc(thDate(x.pub_date))}`).join(" → ")}</span>`
      : `<span>ประกาศ ${esc(thDate(r.pub_date))}</span>`;
    return `<a class="lead" href="${href({ lead: r.lead_key, from: currentView })}">
      <div style="display:grid;gap:5px;min-width:0">
        <div class="badges"><span class="pill type">${esc(TYPE[r.type] || r.type)}</span>${methodPill(r.method)}${scoreBadge(r.score)}${leadPill(r)}${resultPill(r.result)}${changePill(r)}
          ${r.linked_plan && r.type !== "P0" ? `<span class="pill" title="หน่วยงานเดียวกันและงบเท่ากันพอดี">🔗 จับคู่กับแผน ${esc(r.linked_plan)}</span>` : ""}
          ${r.amended && !r.cancelled ? '<span class="pill st">มีการแก้ไขประกาศ</span>' : ""}</div>
        <div class="title">${esc(r.title)}</div>
        <div class="meta"><span>${esc(r.dept_name || "")}</span><span>${esc(r.province || "ไม่ระบุจังหวัด")}</span>${when}${trail}</div>
      </div>
      <div class="money"><span class="label">${r.type === "P0" ? "งบตามแผน" : "งบประมาณ"}</span>
        <span class="amt ${num(r.budget_thb) === null ? "none" : ""}">${num(r.budget_thb) === null ? "ไม่ระบุงบ" : baht(r.budget_thb)}</span>
        <span class="act btn sm ${canEdit ? "primary" : ""}">${canEdit ? "อัปเดตสถานะ" : "ดูรายละเอียด"}</span></div>
    </a>`;
  }

  // ---------------- ภาพรวม ----------------
  function overview(body) {
    const O = state.o;
    const leads = state.leads.filter(areaOk).filter(r => inBand(O.score, r)).filter(r => inMethod(O.method, r));
    const outs = state.outcomes.filter(o => o.kind === "result").filter(o => inBand(O.score, o)).filter(o => inMethod(O.method, o));
    const bidDone = r => r.status === "bid" || r.result === "lost" || r.result === "win";
    const moved = r => !!r.status || bidDone(r);
    const wins = outs.filter(o => o.ours && areaOk(o));
    const plans = leads.filter(r => r.type === "P0"), announced = leads.filter(r => r.type !== "P0");
    // every count leaves the plans out (they have their own box under the table by type)
    const noStatus = announced.filter(r => !moved(r) && leadState(r) === "none");
    const bid = announced.filter(bidDone);
    const soon = leads.filter(r => r.type === "D0" && (d => d !== null && d >= 0 && d <= 7)(daysTo(r.bid_date)))
      .sort((a, b) => a.bid_date.localeCompare(b.bid_date));
    const top = [...leads].filter(r => num(r.budget_thb) !== null).sort((a, b) => num(b.budget_thb) - num(a.budget_thb)).slice(0, 6);
    const byType = ["D0", "15", "B0"].map(t => [t, leads.filter(r => r.type === t && !missed(r))]);
    const letGo = leads.filter(missed);
    const funnel = [["Lead ทั้งหมด", announced.length], ["มีสถานะแล้ว", announced.filter(moved).length],
      ["ส่งให้ Mer", announced.filter(r => ["sent_to_mer", "mer_replied"].includes(r.status) || bidDone(r)).length],
      ["ยื่นราคาแล้ว", bid.length],
      ["ชนะ (จาก Lead)", announced.filter(r => r.result === "win").length]];
    const max = Math.max(1, funnel[0][1]);
    const mini = r => `<a class="mini" href="${href({ lead: r.lead_key, from: "overview" })}"><span class="t">${esc(r.title)}</span><span class="amt">${short(r.budget_thb)}</span>
      <span class="small muted">${esc(TYPE[r.type])} · ${esc(r.dept_name || "")}${r.type === "D0" && r.bid_date ? ` · <span class="${daysTo(r.bid_date) <= 3 ? "urgent" : ""}">ยื่นซอง ${esc(thDate(r.bid_date))} (${dueText(r.bid_date)})</span>` : ""}</span>
      <span>${statusPill(r.status)}</span></a>`;
    const COLS = '<colgroup><col><col style="width:64px"><col style="width:118px"></colgroup>';
    const all = state.leads.filter(areaOk);
    body.innerHTML = `
      <div class="card frows">${methodChips(O.method, all.filter(r => inBand(O.score, r)))}${scoreChips(O.score, all.filter(r => inMethod(O.method, r)))}</div>
      <div class="kpis">
        <a class="kpi" href="${href({ v: "leads", type: "all", status: "all", sync: "overview", score: O.score, method: O.method })}"><span class="label">Lead ในช่วงนี้ (ไม่รวมแผน)</span><span class="value">${announced.length.toLocaleString("th-TH")}</span><span class="sub">งบรวม ${short(sum(announced, "budget_thb"))}</span></a>
        <a class="kpi alert" href="${href({ v: "leads", type: "all", status: "none", sync: "overview", score: O.score, method: O.method })}"><span class="label">ยังไม่มีสถานะ (ไม่รวมแผน)</span><span class="value">${noStatus.length.toLocaleString("th-TH")}</span><span class="sub">งบรวม ${short(sum(noStatus, "budget_thb"))}</span></a>
        <a class="kpi" href="${href({ v: "tracking" })}"><span class="label">ยื่นราคาแล้ว</span><span class="value">${bid.length}</span><span class="sub">งบรวม ${short(sum(bid, "budget_thb"))}</span></a>
        <a class="kpi win" href="${href({ v: "results" })}"><span class="label">OfficeMate ชนะ (ทุกงาน)</span><span class="value">${wins.length}</span><span class="sub">มูลค่า ${short(sum(wins, "winner_price"))} · รวมเฉพาะเจาะจง</span></a>
      </div>
      <div class="ov">
        <div class="card"><div class="section-head"><h2>⏰ ใกล้ปิดรับซอง (7 วัน)</h2><span class="small muted">${soon.length} รายการ</span></div>

          </tbody></table></div>

          </tbody></table></div></div>

    body.querySelectorAll("[data-score]").forEach(b => b.onclick = () => { O.score = b.dataset.score; overview(body); });
    body.querySelectorAll("[data-method]").forEach(b => b.onclick = () => { O.method = b.dataset.method; overview(body); });
  }

  // ---------------- Lead ----------------
  // latest stage first, the order things happen read backwards (as in ภาพรวม)
  // the score bands of the email footer and the คู่มือ tab
  const SCORE_BANDS = [["90", "100–90"], ["75", "89–75"], ["60", "74–60"], ["50", "59–50"]];
  const band = s => s == null || s < 50 ? null : s >= 90 ? "90" : s >= 75 ? "75" : s >= 60 ? "60" : "50";
  const inBand = (k, r) => k === "all" || band(r.score) === k;
  const frow = (label, chips) => `<div class="frow"><span class="flabel">${label}</span><div class="chips" role="group" aria-label="${label}">${chips}</div></div>`;
  const scoreChips = (k0, rows) => frow("คะแนน", SCORE_FILTERS.map(([k, l]) =>
    `<button class="chip" type="button" data-score="${k}" aria-pressed="${k0 === k}">${k === "all" ? l : `<span class="score s${k}">${l}</span>`}<span class="n">${rows.filter(r => inBand(k, r)).length}</span></button>`).join(""));
  const SCORE_FILTERS = [["all", "ทุกช่วงคะแนน"], ...SCORE_BANDS];
  const methodChips = (k0, rows) => frow("วิธีจัดหา", METHOD_FILTERS.map(([k, l]) =>
    `<button class="chip" type="button" data-method="${k}" aria-pressed="${k0 === k}">${l}<span class="n">${rows.filter(r => inMethod(k, r)).length}</span></button>`).join(""));
  const TYPE_FILTERS = [["all", "ทั้งหมด"], ["D0", "ประกาศเชิญชวน"], ["15", "ราคากลาง"], ["B0", "ร่าง TOR"], ["P0", "แผนจัดซื้อ"]];
  const STATUS_FILTERS = [["all", "ทุกสถานะ", () => true],
    ...[["none", "ยังไม่มีสถานะ"], ["doing", "กำลังทำ"], ["bid", "ยื่นแล้ว"], ["no_bid", "ไม่ยื่น"],
      ["missed", "เลยวันยื่นซอง ไม่มีใครอัปเดต"], ["cancelled", "ยกเลิกแล้ว"]].map(([k, l]) => [k, l, r => leadState(r) === k])];
  const SORTS = { score: ["คะแนนสูงสุด แล้วงบสูงสุด", (a, b) => b.score - a.score || (num(b.budget_thb) || -1) - (num(a.budget_thb) || -1)],
    budget: ["งบสูงสุด", (a, b) => (num(b.budget_thb) ?? -1) - (num(a.budget_thb) ?? -1) || b.score - a.score],
    deadline: ["ใกล้วันยื่นซอง", (a, b) => { const x = daysTo(a.bid_date), y = daysTo(b.bid_date);
      return ((x !== null && x >= 0) ? x : 9999) - ((y !== null && y >= 0) ? y : 9999) || b.score - a.score; }],
    newest: ["ประกาศล่าสุด", (a, b) => String(b.pub_date).localeCompare(String(a.pub_date)) || b.score - a.score] };

  function leadsPage(body, redraw) {

    const byType = r => L.type === "all" || r.type === L.type, byScore = r => inBand(L.score, r), byMethod = r => inMethod(L.method, r);
    const byText = r => !q || `${r.title} ${r.dept_name} ${r.province || ""} ${r.project_no || ""} ${r.plan_no || ""} ${r.linked_plan || ""}`.toLowerCase().includes(q);
    const rows = area.filter(byType).filter(byScore).filter(byMethod).filter(sf).filter(byText).sort(SORTS[L.sort][1]);
    const picked = [L.type !== "all" && TYPE_FILTERS.find(f => f[0] === L.type)[1], L.method !== "all" && METHOD_FILTERS.find(f => f[0] === L.method)[1],
      L.score !== "all" && SCORE_FILTERS.find(f => f[0] === L.score)[1],
      L.status !== "all" && STATUS_FILTERS.find(f => f[0] === L.status)[1], q && `“${L.q.trim()}”`].filter(Boolean);
    body.innerHTML = `
      <div class="card">
        <button class="btn ftoggle" type="button" id="ftog" aria-expanded="${!!L.fopen}"><span>ตัวกรอง: ${esc(picked.join(" · ") || "ทั้งหมด")}</span><span>${L.fopen ? "▲" : "▼"}</span></button>

        ${methodChips(L.method, area.filter(byType).filter(byScore).filter(sf).filter(byText))}
        ${scoreChips(L.score, area.filter(byType).filter(byMethod).filter(sf).filter(byText))}
        ${frow("สถานะ", STATUS_FILTERS.map(([k, l, f]) =>
          `<button class="chip" type="button" data-status="${k}" aria-pressed="${L.status === k}">${l}<span class="n">${area.filter(byType).filter(byScore).filter(byMethod).filter(byText).filter(f).length}</span></button>`).join(""))}
        <div class="toolrow">
          <input class="txt" id="q" type="search" placeholder="ค้นหาชื่อ หน่วยงาน เลขโครงการ/แผน" value="${esc(L.q)}" aria-label="ค้นหาชื่อโครงการ หน่วยงาน จังหวัด เลขโครงการ หรือเลขแผน">
          <div class="daterow"><label class="small muted" for="sort">เรียง</label>
            <select id="sort">${Object.entries(SORTS).map(([k, [l]]) => `<option value="${k}" ${L.sort === k ? "selected" : ""}>${l}</option>`).join("")}</select>
            <button class="btn" type="button" id="dl">⬇ Excel</button></div>
        </div>
        ${picked.length ? '<div><button class="btn sm" type="button" id="clear">ล้างตัวกรอง</button></div>' : ""}
        </div>
        <div class="small muted">${rows.length.toLocaleString("th-TH")} โครงการ · งบรวม ${short(sum(rows, "budget_thb"))} · โครงการที่มีหลายประกาศแสดงครั้งเดียวตามประกาศล่าสุด${awardedN ? ` · ซ่อน ${awardedN} โครงการที่ประกาศผู้ชนะแล้ว (ดูในแท็บผลลัพธ์)` : ""}</div>
      </div>
      <div class="list">${rows.slice(0, L.shown).map(leadCard).join("") || '<div class="card empty">ไม่มี Lead ตามตัวกรองนี้ ลองเปลี่ยนช่วงเวลาหรือพื้นที่</div>'}</div>
      ${rows.length > L.shown ? `<div style="text-align:center"><button class="btn" type="button" id="more">แสดงเพิ่ม (${rows.length - L.shown})</button></div>` : ""}`;
    body.querySelectorAll("[data-type]").forEach(b => b.onclick = () => { L.type = b.dataset.type; L.shown = 60; leadsPage(body, redraw); });
    body.querySelectorAll("[data-score]").forEach(b => b.onclick = () => { L.score = b.dataset.score; L.shown = 60; leadsPage(body, redraw); });
    body.querySelectorAll("[data-status]").forEach(b => b.onclick = () => { L.status = b.dataset.status; L.shown = 60; leadsPage(body, redraw); });
    document.getElementById("sort").onchange = e => { L.sort = e.target.value; leadsPage(body, redraw); };
    document.getElementById("ftog").onclick = () => { L.fopen = !L.fopen; leadsPage(body, redraw); };
    const clear = document.getElementById("clear");
    if (clear) clear.onclick = () => { Object.assign(L, { type: "all", score: "all", method: "all", status: "all", q: "", shown: 60 }); leadsPage(body, redraw); };
    body.querySelectorAll("[data-method]").forEach(b => b.onclick = () => { L.method = b.dataset.method; L.shown = 60; leadsPage(body, redraw); });
    const qi = document.getElementById("q");
    qi.oninput = () => { L.q = qi.value; const p = qi.selectionStart; leadsPage(body, redraw); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(p, p); };
    const more = document.getElementById("more"); if (more) more.onclick = () => { L.shown += 60; leadsPage(body, redraw); };
    document.getElementById("dl").onclick = () => download(`Lead_${AREA.find(a => a[0] === state.area)[1]}`, rows.map(r => ({
      "วันที่ในอีเมล": r.email_date, "ประเภทประกาศ (ล่าสุด)": TYPE[r.type],
      "ประกาศของโครงการ": (r.stages || []).map(x => `${TYPE[x.type] || x.type} ${x.pub_date}`).join(" → "), "คะแนน": r.score, "ชื่อโครงการ": r.title, "หน่วยงาน": r.dept_name,
      "จังหวัด": r.province || "", "งบประมาณ (บาท)": num(r.budget_thb) ?? "", "วันยื่นซอง": r.bid_date || "", "เวลายื่น": r.bid_time || "",
      "คาดว่าจะประกาศ": monthLabel(r.expected_month), "วันที่ประกาศ": r.pub_date, "หมวดสินค้า": r.category || "", "เหตุผล": r.reason || "",
      "สถานะล่าสุด": r.status ? STATUS[r.status].replace(/^\S+\s/, "") : missed(r) ? "เลยวันยื่นซอง ไม่มีใครอัปเดต" : "", "ผล": r.result ? RESULT[r.result][0].replace("🏆 ", "") : "",
      "ผู้ชนะ": r.winners || "", "ราคาที่ชนะ (บาท)": num(r.winner_price) ?? "", "ยกเลิกแล้ว": r.cancelled ? "ใช่" : "",
      "วิธีจัดหา": r.method || "", "เลขโครงการ": r.project_no || "", "เลขแผน": r.plan_no || r.linked_plan || "", "ลิงก์": r.link })));
  }

  // ---------------- ติดตามสถานะ ----------------
  const STAGES = [["all", "ทั้งหมด", () => true],
    ["doing", "กำลังดำเนินการ", r => ["received", "contacted", "other"].includes(r.status) && !r.result],
    ["mer", "รอ Mer", r => r.status === "sent_to_mer" && !r.result], ["merok", "Mer ตอบแล้ว", r => r.status === "mer_replied" && !r.result],
    ["bid", "ยื่นราคาแล้ว รอผล", r => r.status === "bid" && !r.result], ["result", "มีผลแล้ว", r => !!r.result],
    ["nobid", "ไม่ยื่น", r => r.status === "no_bid" && !r.result]];
  const TSORTS = { latest: ["อัปเดตล่าสุด", (a, b) => String(b.status_at).localeCompare(String(a.status_at))],
    deadline: ["ใกล้วันยื่นซอง", SORTS.deadline[1]], budget: ["งบสูงสุด", SORTS.budget[1]] };

  function tracking(body) {
    const T = state.t;
    // by the Bangkok day of the latest status update
    const bkkDay = t => new Date(new Date(t).getTime() + 7 * 3600e3).toISOString().slice(0, 10);
    const inRange = state.tracking.filter(areaOk).filter(r => { const d = bkkDay(r.status_at); return d >= state.per.tracking.from && d <= state.per.tracking.to; });
    const people = [...new Set(inRange.map(r => r.status_by).filter(Boolean))].sort((a, b) => a.localeCompare(b, "th"));
    if (T.who !== "all" && !people.includes(T.who)) T.who = "all";
    const base = inRange.filter(r => T.who === "all" || r.status_by === T.who);
    const rows = base.filter(STAGES.find(x => x[0] === T.col)[2]).sort(TSORTS[T.sort][1]);
    const row = r => { const left = daysTo(r.bid_date);
      return `<a class="lead" href="${href({ lead: r.lead_key, from: "tracking" })}">
      <div style="display:grid;gap:5px;min-width:0">
        <div class="badges">${r.auto_result ? '<span class="pill">ไม่มีการกดสถานะ</span>' : statusPill(r.status)}${resultPill(r.result)}${changePill(r)}${r.type ? `<span class="pill type">${esc(TYPE[r.type] || r.type)}</span>` : ""}${methodPill(r.method)}${r.cancelled ? '<span class="pill bad">ยกเลิกแล้ว</span>' : ""}</div>
        <div class="title">${esc(r.title || r.lead_key)}</div>
        <div class="meta"><span>${esc(r.dept_name || "")}</span><span>${esc(r.province || "ไม่ระบุจังหวัด")}</span>
          ${r.bid_date ? `<span class="${left !== null && left >= 0 && left <= 3 ? "urgent" : ""}">ยื่นซอง ${esc(thDate(r.bid_date))}${left !== null && left >= 0 ? ` · ${dueText(r.bid_date)}` : " · ปิดแล้ว"}</span>` : ""}</div>
        <div class="meta">${r.auto_result ? `<span>ระบบพบผลจากประกาศผู้ชนะ · ${esc(thTime(r.status_at))} · ยื่นไปก่อนมีระบบ หรือไม่มีใครกดสถานะ</span>`
          : `<span>อัปเดตโดย <b class="who-by">${esc(r.status_by || "–")}</b> · ${esc(thTime(r.status_at))}${r.n_events > 1 ? ` · ${r.n_events} ครั้ง` : ""}</span>`}
          ${r.reasons && r.reasons.length ? `<span>เหตุผล: ${esc(r.reasons.join(", "))}</span>` : ""}${r.note ? `<span>“${esc(r.note)}”</span>` : ""}</div>
      </div>
      <div class="money"><span class="label">งบประมาณ</span>
        <span class="amt ${num(r.budget_thb) === null ? "none" : ""}">${num(r.budget_thb) === null ? "ไม่ระบุงบ" : baht(r.budget_thb)}</span>
        ${num(r.bid_price) !== null ? `<span class="small muted">ราคาที่ยื่น ${baht(r.bid_price)}</span>` : ""}
        ${r.winner_price && r.result ? `<span class="small muted">ราคาที่ชนะ ${baht(r.winner_price)}</span>` : ""}
        <span class="act btn sm ${mayEdit() && !closed(r) ? "primary" : ""}">${mayEdit() && !closed(r) ? "อัปเดตสถานะ" : "ดูรายละเอียด"}</span></div></a>`; };
    body.innerHTML = `
      <div class="card">
        <div class="chips" role="group" aria-label="ขั้น">${STAGES.map(([k, l, f]) =>
          `<button class="chip" type="button" data-col="${k}" aria-pressed="${T.col === k}">${l}<span class="n">${base.filter(f).length}</span></button>`).join("")}</div>
        <div class="toolrow">
          <div class="daterow"><label class="small muted" for="who-f">ผู้อัปเดต</label>
            <select id="who-f"><option value="all">ทุกคน (${inRange.length})</option>${people.map(n => `<option value="${esc(n)}" ${T.who === n ? "selected" : ""}>${esc(n)} (${inRange.filter(r => r.status_by === n).length})</option>`).join("")}</select></div>
          <div class="daterow"><label class="small muted" for="tsort">เรียง</label>
            <select id="tsort">${Object.entries(TSORTS).map(([k, [l]]) => `<option value="${k}" ${T.sort === k ? "selected" : ""}>${l}</option>`).join("")}</select></div>
        </div>
        <div class="small muted">${rows.length.toLocaleString("th-TH")} โครงการ · งบรวม ${short(sum(rows, "budget_thb"))}</div>
      </div>
      <div class="list">${rows.slice(0, T.shown).map(row).join("") || `<div class="card empty">ไม่มีโครงการในขั้นนี้ · ลองเลือก “ทั้งหมด” ขยายช่วงวันที่${state.area !== "all" ? " หรือเปลี่ยนพื้นที่" : ""}</div>`}</div>
      ${rows.length > T.shown ? `<div style="text-align:center"><button class="btn" type="button" id="more">แสดงเพิ่ม (${rows.length - T.shown})</button></div>` : ""}`;
    body.querySelectorAll("[data-col]").forEach(b => b.onclick = () => { T.col = b.dataset.col; T.shown = 50; tracking(body); });
    document.getElementById("who-f").onchange = e => { T.who = e.target.value; T.shown = 50; tracking(body); };
    document.getElementById("tsort").onchange = e => { T.sort = e.target.value; tracking(body); };
    const more = document.getElementById("more"); if (more) more.onclick = () => { T.shown += 50; tracking(body); };
  }

  // ---------------- ผลลัพธ์ ----------------
  function results(body, redraw) {
    const R = state.r;
    const area = state.outcomes.filter(areaOk);
    const outs = area.filter(o => inBand(R.score, o)).filter(o => inMethod(R.method, o));
    const res = outs.filter(o => o.kind === "result");
    const byPrice = (a, b) => (num(b.winner_price) || 0) - (num(a.winner_price) || 0);
    const wins = res.filter(o => o.ours).sort(byPrice);
    const leadRes = res.filter(o => o.lead_types).sort(byPrice);
    const lost = leadRes.filter(o => !o.ours);
    const cancelled = outs.filter(o => o.kind === "cancelled");
    const changed = outs.filter(o => o.kind === "changed");
    const rivals = {};
    res.filter(o => !o.ours && o.winners).forEach(o => { const r = rivals[o.winners] || (rivals[o.winners] = { n: 0, v: 0, rows: [] }); r.n++; r.v += num(o.winner_price) || 0; r.rows.push(o); });
    const top = Object.entries(rivals).sort((a, b) => b[1].n - a[1].n || b[1].v - a[1].v).slice(0, 10);
    const q = R.q.trim().toLowerCase();
    const all = res.filter(o => !q || `${o.title} ${o.dept_name} ${o.winners} ${o.province || ""}`.toLowerCase().includes(q)).sort(byPrice);
    const proj = o => `${o.project_no ? `<a href="${href({ lead: o.project_no, from: "results" })}">${esc(o.title)}</a>` : esc(o.title)}
      <a class="small" href="${esc(o.link)}" target="_blank" rel="noopener noreferrer" title="เปิดเอกสารประกาศใน e-GP">เอกสาร e-GP ↗</a>

  async function showLead(key, from) {
    main.innerHTML = `<div><a href="${href({ v: from || "leads" })}">← กลับ</a></div><div class="list"><div class="skeleton"></div><div class="skeleton"></div></div>`;
    try {
      const data = await api("lead", { key });
      current = { key: data.lead_key || key, from: from || "leads", data, status: null, reasons: new Set() };
      renderLead();
    } catch (e) { main.innerHTML = `<div><a href="${href({ v: from || "leads" })}">← กลับ</a></div><div class="card empty error">${esc(e.message)}</div>`; }
  }

  function leadSummary(anns) {
    const order = ["D0", "B0", "15", "P0"];
    const main0 = [...anns].sort((a, b) => order.indexOf(a.type) - order.indexOf(b.type)).find(a => order.includes(a.type)) || anns[0];
    const budgets = anns.map(a => num(a.budget_thb)).filter(v => v !== null);
    return { main: main0, budget: budgets.length ? Math.max(...budgets) : null, d0: anns.find(a => a.type === "D0" && a.bid_date),
      // latest winner announcement: W0, W2 (changed) or W1 (withdrawn)
      award: [...anns].filter(a => ["W0", "W1", "W2"].includes(a.type)).sort((a, b) => String(a.pub_date).localeCompare(String(b.pub_date))).pop(),
      province: anns.map(a => a.province).find(Boolean) || "" };
  }

  function renderLead() {
    const { data } = current;
    const anns = data.announcements, s = leadSummary(anns), isDV = EDITORS.includes(data.user.role);
    const events = data.events || [], last = events[events.length - 1];
    const left = s.d0 ? daysTo(s.d0.bid_date) : null;
    const aw = s.award, named = aw && Array.isArray(aw.winners) && aw.winners.length ? aw.winners.join(", ") : null;
    const outcome = aw ? (aw.type === "W1" ? '<span class="pill warn">🔄 ยกเลิกประกาศผู้ชนะ รอประกาศใหม่</span>'
        : (!named ? '<span class="pill">ประกาศผู้ชนะแล้ว</span>'
          : isOurs(named) ? `<span class="pill win">🏆 OfficeMate ชนะ · ${baht(aw.winner_price)}</span>`
          : `<span class="pill bad">ผู้ชนะ: ${esc(named)} · ${baht(aw.winner_price)}</span>`)
          + (aw.type === "W2" ? '<span class="pill warn">🔄 เปลี่ยนผู้ชนะ</span>' : ""))
      : anns.some(a => a.type === "D1") ? '<span class="pill bad">ยกเลิกโครงการ</span>' : "";
    const awarded = !!aw && aw.type !== "W1";
    const locked = awarded || anns.some(a => a.type === "D1");
    const form = isDV && locked ? `<div class="card"><h2>อัปเดตสถานะ</h2><div class="small muted">${awarded ? "โครงการนี้ประกาศผู้ชนะแล้ว" : "โครงการนี้ถูกยกเลิกแล้ว"} จึงปิดการอัปเดตสถานะ · ผลดูได้ที่แท็บ ผลลัพธ์ และ ติดตามสถานะ</div></div>`
      : isDV ? `<div class="card" id="form"><h2>อัปเดตสถานะ</h2>
        ${GROUPS.map(([label, keys]) => `<div class="group"><span>${label}</span><div class="chips">${keys.map(k => `<button class="btn" type="button" data-s="${k}" aria-pressed="${current.status === k}">${STATUS[k]}</button>`).join("")}</div></div>`).join("")}
        <div class="group" id="reasons" ${current.status === "no_bid" ? "" : "hidden"}><span>เหตุผลที่ไม่ยื่น (เลือกได้หลายข้อ)</span>
          <div class="chips">${REASONS.map(r => `<button class="chip reason" type="button" aria-pressed="${current.reasons.has(r)}">${r}</button>`).join("")}</div></div>
        <label class="fld" id="pricebox" ${current.status === "bid" ? "" : "hidden"}>ราคาที่ยื่น (บาท) ไม่บังคับ<input class="txt" id="price" inputmode="decimal" placeholder="เช่น 1,180,000"></label>
        <label class="fld">หมายเหตุ <span id="notehint">${current.status === "other" ? "(ต้องใส่สำหรับ “อื่น ๆ”)" : "(ไม่บังคับ)"}</span><textarea id="note" rows="2" placeholder="เช่น นัดคุยฝ่ายพัสดุวันพฤหัส"></textarea></label>
        <div><button class="btn primary" type="button" id="save">บันทึก</button></div><div class="msg" id="msg" aria-live="polite"></div></div>` : "";
    main.innerHTML = `
      <div><a href="${href({ v: current.from })}">← กลับ</a></div>
      <div class="card hero">
        <div style="display:grid;gap:6px;min-width:0">
          <div class="chips"><span class="pill type">${esc(TYPE[s.main.type] || s.main.type)}</span>${statusPill(last && last.status)}${outcome}</div>
          <h1>${esc(s.main.title)}</h1>
          <div class="meta"><span>${esc(s.main.dept_name)}</span><span>${esc(s.province || "ไม่ระบุจังหวัด")}</span>
            ${s.d0 ? `<span class="${left !== null && left >= 0 && left <= 3 ? "urgent" : ""}">ยื่นซอง ${esc(thDate(s.d0.bid_date))} ${esc(s.d0.bid_time || "")}${left !== null && left >= 0 ? ` · ${dueText(s.d0.bid_date)}` : ""}</span>` : ""}
            <span>${esc(current.key.startsWith("P:") ? "เลขแผน " + current.key.slice(2) : "เลขโครงการ " + current.key)}</span>
            ${data.linked_plan ? `<span>🔗 จับคู่กับแผน ${esc(data.linked_plan)}</span>` : ""}</div>
        </div>
        <div><div class="small muted amt-label">งบประมาณ</div><div class="amt">${s.budget === null ? '<span class="muted" style="font-size:16px">ไม่ระบุงบ</span>' : baht(s.budget)}</div></div>
      </div>
      <div class="two">
        <div style="display:grid;gap:14px">${form}
          <div class="card"><h2>ประวัติ</h2><div class="timeline">${events.length ? events.map(e => `<div><div class="when">${esc(thTime(e.at))} · ${esc(e.by)}</div>
            <div>${esc(STATUS[e.status] || e.status)}${e.reasons && e.reasons.length ? " · " + esc(e.reasons.join(", ")) : ""}${e.bid_price !== null && e.bid_price !== undefined ? " · " + baht(e.bid_price) : ""}</div>
            ${e.note ? `<div class="small muted">${esc(e.note)}</div>` : ""}</div>`).join("") : '<div class="small muted">ยังไม่มีการอัปเดตสถานะ</div>'}</div></div>
        </div>
        <div class="side" style="display:grid;gap:14px">
          <div class="card"><h2>ประกาศของโครงการนี้</h2><div>${anns.map(a => `<div class="ann">
            <div class="small muted">${esc(TYPE[a.type] || a.type)} · ประกาศ ${esc(thDate(a.pub_date))}</div>
            <a href="${esc(a.link)}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a>
            <div class="meta">${num(a.budget_thb) !== null ? `<span>งบ ${baht(a.budget_thb)}</span>` : ""}${a.bid_date ? `<span>ยื่นซอง ${esc(thDate(a.bid_date))} ${esc(a.bid_time || "")}</span>` : ""}
              ${a.expected_month ? `<span>คาดว่าจะประกาศ ${esc(monthLabel(a.expected_month))}</span>` : ""}${Array.isArray(a.winners) && a.winners.length ? `<span>ผู้ชนะ ${esc(a.winners.join(", "))} · ${baht(a.winner_price)}</span>` : ""}
              ${a.method ? `<span>${esc(a.method)}</span>` : ""}</div></div>`).join("")}</div></div>
        </div>
      </div>`;
    if (!isDV || locked) return;
    const f = document.getElementById("form");
    f.querySelectorAll("[data-s]").forEach(b => b.onclick = () => {
      current.status = b.dataset.s;
      f.querySelectorAll("[data-s]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      document.getElementById("reasons").hidden = current.status !== "no_bid";
      document.getElementById("pricebox").hidden = current.status !== "bid";
      document.getElementById("notehint").textContent = current.status === "other" ? "(ต้องใส่สำหรับ “อื่น ๆ”)" : "(ไม่บังคับ)";
      document.getElementById("msg").textContent = "";
    });
    f.querySelectorAll(".reason").forEach(c => c.onclick = () => {
      const r = c.textContent; if (current.reasons.has(r)) current.reasons.delete(r); else current.reasons.add(r);
      c.setAttribute("aria-pressed", String(current.reasons.has(r)));
    });
    document.getElementById("save").onclick = async () => {
      const msg = document.getElementById("msg"), btn = document.getElementById("save"), note = document.getElementById("note").value.trim();
      const err = t => { msg.className = "msg err"; msg.textContent = t; };
      if (!current.status) return err("เลือกสถานะก่อน แล้วกดบันทึก");
      if (current.status === "no_bid" && !current.reasons.size) return err("เลือกเหตุผลที่ไม่ยื่นอย่างน้อย 1 ข้อ");
      if (current.status === "other" && !note) return err("สถานะ “อื่น ๆ” ต้องใส่หมายเหตุ");
      btn.disabled = true; msg.className = "msg"; msg.textContent = "กำลังบันทึก…";
      try {
        const res = await api("save", { key: current.key, status: current.status, reasons: [...current.reasons],
          bid_price: current.status === "bid" ? document.getElementById("price").value.trim() : null, note });
        current.data.events = res.events; current.status = null; current.reasons = new Set();
        state.cache = {}; state.tracking = null;           // lists show the new status next time
        renderLead();
        const m = document.getElementById("msg"); m.className = "msg ok"; m.textContent = "บันทึกแล้ว";
      } catch (e) { btn.disabled = false; err(e.message); }
    };
  }

  // ---------------- routing ----------------
  let currentView = "leads";

  async function route() {
    const p = hashParams();
    if (!/^[0-9a-f]{64}$/.test(token())) {
      renderNav(null);
      main.innerHTML = '<div class="card empty">เปิดหน้านี้จากปุ่ม “อัปเดตสถานะ” หรือลิงก์ KG Lead ในอีเมล e-GP Alert</div>';
      return;
    }
    window.scrollTo(0, 0);
    const lead = p.get("lead");
    const view = VIEWS.some(v => v[0] === p.get("v")) ? p.get("v") : "leads";
    if (p.get("status")) state.l.status = p.get("status");
    if (p.get("type")) { state.l.type = p.get("type"); state.l.score = p.get("score") || "all"; state.l.method = p.get("method") || "all"; }
    if (p.get("sort")) state.l.sort = p.get("sort");
    if (lead) { renderNav(p.get("from") || "leads"); return showLead(lead, p.get("from")); }
    currentView = view;
    renderNav(view);
    try {
      if (!state.days.length) { state.days = (await api("days")).days || []; Object.values(state.per).forEach(x => applyPreset(x.preset, x)); }
    } catch (e) { main.innerHTML = `<div class="card empty error">${esc(e.message)}</div>`; return; }
    const sync = state.per[p.get("sync")];
    if (sync && state.per[view] && sync !== state.per[view]) Object.assign(state.per[view], sync);
    if (view === "guide") return guide();
    if (view === "tracking") return page(view, tracking, { load: async () => { if (!state.tracking) state.tracking = (await api("tracking")).rows || []; } });
    const build = { overview, leads: leadsPage, results }[view];
    return page(view, build, { load: ensureRange });
  }
  addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
