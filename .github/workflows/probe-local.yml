name: Probe local-government codes (read-only)

on:
  workflow_dispatch:

jobs:
  # Eight machines, each with its own IP, so each can keep 2 requests in flight (HTTP 429 above that).
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/probe_local.py --shard ${{ matrix.shard }} --shards 8
