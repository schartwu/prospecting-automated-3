name: Phase 0 - Discovery

# Phase 0 research collector, run by hand only. Production collection is daily.yml.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "types = known depts x all announce types, sweep = scan deptId 0001-9999"
        type: choice
        options: [types, sweep]
        default: types

permissions:
  contents: write

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect
        run: python scripts/discover.py --mode "${{ inputs.mode || 'types' }}" --max-minutes 100

      - name: Load into Supabase
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/load_runs.py

      - name: Keep raw data as a run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-${{ github.run_id }}
          path: data/discovery
          retention-days: 30

      # Raw data lives in a new folder per run, so it never conflicts. The summary is rebuilt
      # after pulling, so it always covers every run, including ones that finished meanwhile.
      - name: Commit data and summary
        if: always()
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action Bot"
          git add data/discovery
          git commit -m "Discovery data (${{ inputs.mode || 'types' }})" || true
          git pull --rebase origin main
          python scripts/report_discovery.py
          git add reports
          git commit -m "Discovery summary" || true
          git push origin main
