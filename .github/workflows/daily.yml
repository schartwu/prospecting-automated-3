name: Daily pipeline

# Evening run after the working day, so the day's announcements are complete (the digest is D-1).
# Started at 18:00 Bangkok every day by Supabase pg_cron ('egp-daily-pipeline'), because GitHub's own
# schedule started it 7-9 h late. Can also be run by hand.
on:
  workflow_dispatch:

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  # Eight machines share the departments (about 1,100 since local governments were added on 29 Oct 2026).
  # Each has its own IP, so each can keep 2 requests in
  # flight without the e-GP server answering HTTP 429.
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 1. Collect RSS (this machine's share of the departments)
        run: python scripts/collect.py --mode daily --shard ${{ matrix.shard }} --shards 8 --max-minutes 170
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: data/runs
          retention-days: 30

  process:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: daily-shard-*-${{ github.run_id }}
          path: data/runs
          merge-multiple: true

      # Each step runs even if an earlier one had trouble, so partial data still flows through.
      - name: 2. Load into Supabase
        if: always()
        run: python scripts/load_runs.py

      # Emails ADMIN_ALERT_EMAIL when most requests failed (e.g. 22-24 Oct 2026); the run goes on regardless.
      - name: 2b. Check the collection
        if: always()
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          ADMIN_ALERT_EMAIL: ${{ vars.ADMIN_ALERT_EMAIL }}
        run: python scripts/health.py

      - name: 3. Classify (rules first, Gemini within daily budgets)
        if: always()
        run: python scripts/classify.py

      - name: 4. Read documents (budget, bid date)
        if: always()
        run: python scripts/enrich.py
