name: Add purchasing units and new agencies

# By hand; the same step runs every evening as daily.yml's "units" job. The RSS only answers after
# office hours, so run this after 17:00 Bangkok.
on:
  workflow_dispatch:
    inputs:
      test:
        description: "codes of unknown agencies to try on the RSS"
        default: "80"

jobs:
  units:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TARGET_PROVINCES: ${{ vars.TARGET_PROVINCES }}
      TEST: ${{ inputs.test }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/units.py --test "$TEST"
