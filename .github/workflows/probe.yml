name: Probe department codes (read-only)

on:
  workflow_dispatch:
    inputs:
      codes:
        description: "Department codes, space separated"
        required: true
      find:
        description: "Project number to look for"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          CODES: ${{ inputs.codes }}
          FIND: ${{ inputs.find }}
        run: python scripts/probe_dept.py $CODES --find "$FIND"
